     stage:4,intent:6,context:[{k:"意向",v:"下单2台银色"},{k:"颜色",v:"银色"}],lastRead:{posture:"推进",concern:"确认无误"},msgs:[{f:"me",t:"工厂直发，今天发最快。确认颜色"},{f:"c",t:"Okok send 2 silver color. And let me know if I alipay you."}]},
   {k:"msg",w:"m",t:"10/22 02:38",x:"吴秋平（收款户名）"},

     gt:"不慌，一句话解释“银行转账要核对户名，复制粘贴即可”；收款后主动汇报“已收到，等快递取件”",nt:"支付摩擦要提前一步铺好：币种→账户→户名→用途说明。别把“?”当成不信任。",
     stage:5,intent:6,context:[{k:"状态",v:"已付款，等快递取件"},{k:"场景",v:"客户看到收款户名吴秋平，发了个问号"}],lastRead:{posture:"正常",concern:"确认户名用途"},msgs:[{f:"me",t:"吴秋平"},{f:"c",t:"?"}]},
   {k:"msg",w:"c",t:"10/22 05:08",x:"🤣 Wow · Didn't knew dear · Hi cherry How are you"},
   {k:"stage",l:"阶段⑦ 关系升级"},
   {k:"node",id:11,label:"节点12 · 关系升级（成交后纠正称呼）",cust:"客户一路叫 brother",
     gt:"钱到账、货发出后，才说“我是女的，叫Cherry”；客户🤣→改口“dear / Hi cherry How are you”",nt:"时机是全部：成交前纠正会生分，成交后纠正变成玩笑。零成本把称呼从bro升到dear。",
     stage:5,intent:6,context:[{k:"状态",v:"已付款发货"},{k:"称呼",v:"客户一直叫 brother"}],lastRead:{posture:"正常",concern:"关系维护"},msgs:[{f:"me",t:"I've received your payment"},{f:"c",t:"Ok bro."}]}

/* ===== 渲染 + 实时调用 + 判定 ===== */
var MARK_KEY = "review.marks.v1";
function marks(){ try{ return JSON.parse(localStorage.getItem(MARK_KEY))||{}; }catch(e){ return {}; } }
function saveMarks(m){ localStorage.setItem(MARK_KEY, JSON.stringify(m)); }
var cur = null;
function fillCaseSel(){ var s=document.getElementById("caseSel"); s.innerHTML=""; CASES.forEach(function(c){ var o=document.createElement("option"); o.value=c.id; o.textContent=c.title; s.appendChild(o); }); }
function renderCase(){
  var sel=document.getElementById("caseSel"); var id=sel.value||(CASES[0]&&CASES[0].id);
  if(sel&&CASES[0]&&!id) sel.value=CASES[0].id;
  cur=CASES.filter(function(c){return c.id===id;})[0]; if(!cur) return;
  document.getElementById("meta").innerHTML='<div class="meta">'+esc(cur.sub)+'</div>';
  document.getElementById("stat").innerHTML=cur.stats.map(function(s){return '<div>'+esc(s[0])+'<span style="color:var(--mut)">'+esc(s[1])+'</span></div>';}).join("");
  var tl="";
  cur.blocks.forEach(function(b){
    if(b.k==="stage") tl+='<div class="stage">'+esc(b.l)+'</div>';
    else if(b.k==="msg") tl+='<div class="msg '+(b.w==="c"?"c":"m")+'"><div class="who">'+(b.w==="c"?"客户":"吴总")+'<span class="t">'+esc(b.t)+'</span></div><div class="txt">'+esc(b.x)+'</div></div>';
    else if(b.k==="node") tl+=nodeHtml(b);
  });
  document.getElementById("tl").innerHTML=tl;
  updateSum();
}
function nodeHtml(n){
  var mk=marks()[(cur.id+":"+n.id)]||{};
  return '<div class="node" id="n'+n.id+'">'
    +'<div class="rh">'+esc(n.label)+'</div>'
    +'<div class="row"><span class="lb">客户在试探什么</span>'+esc(n.cust)+'</div>'
    +'<button class="run" id="r'+n.id+'" onclick="runNode('+n.id+')">▶ 跑 谈单舱（线上 brain 实时生成）</button>'
    +'<div id="a'+n.id+'"></div>'
    +'<div class="row gt"><span class="lb">✅ 吴总当时实际怎么回</span>'+esc(n.gt)+'</div>'
    +'<div class="row nt"><span class="lb">差异点 / 为什么</span>'+esc(n.nt)+'</div>'
    +(n.boss?'<div class="row bb"><span class="lb">📌 老板判词（Phil 红笔 2026-10-24）</span>'+esc(n.boss)+'</div>':"")
    +'<div class="judge">'
      +'<button id="g'+n.id+'" onclick="judge('+n.id+',\'good\')">对</button>'
      +'<button id="b'+n.id+'" onclick="judge('+n.id+',\'bad\')">差</button>'
      +'<button id="x'+n.id+'" onclick="judge('+n.id+',\'fix\')">改</button>'
      +'<input id="note'+n.id+'" placeholder="一句话：错在哪 / 吴总会怎么说" value="'+esc(mk.note||"")+'" onchange="saveNote('+n.id+')" />'
    +'</div></div>';
}
function buyerOf(n){
  var o=(cur&&cur.owner)||{name:"—",country:"—",company:"—"};
  return { name:o.name, country:o.country, company:o.company, scope:"suitcase",
    stage:n.stage, intent:n.intent, context:n.context, lastRead:n.lastRead,
    messages:(n.msgs||[]).map(function(m){ return { from:(m.f==="me"?"me":"buyer"), text:m.t }; }) };
}
function runNode(nid){
  var n=cur.blocks.filter(function(b){return b.k==="node"&&b.id===nid;})[0];
  var btn=document.getElementById("r"+nid), box=document.getElementById("a"+nid);
  btn.disabled=true; btn.textContent="生成中…";
  box.innerHTML='<div class="ai"><span class="lb">🤖 谈单舱</span><div class="loading">线上 brain 生成中，约 2–4 秒…</div></div>';
  var au=authGet(); var sess=au&&au.session;
  if(!sess){ box.innerHTML='<div class="ai"><span class="lb">未登录</span>请先登录。</div>'; btn.disabled=false; btn.textContent="▶ 跑 谈单舱"; return; }
  var b=buyerOf(n);
  fetch(proxyUrl()+"/llm",{method:"POST",headers:{"Content-Type":"application/json","x-dealdesk-session":sess,"x-dealdesk-scope":"suitcase"},
    body:JSON.stringify({model:"qwen-flash",messages:[{role:"system",content:ctx(b)+factRule()},{role:"user",content:window.Prompts.suggest(b)}],max_tokens:600,temperature:0.4})})
   .then(function(r){return r.json();})
   .then(function(j){ var c=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||j.content||JSON.stringify(j); var s=parseSuggest(c);
     box.innerHTML='<div class="ai"><span class="lb">🤖 谈单舱真实生成（qwen-flash + 线上资料）</span>'
       +'<div class="mv">出招：'+esc(s.move)+(s.nextGoal?' ｜ 目标：'+esc(s.nextGoal):"")+(s.blocker?' ｜ 卡点：'+esc(s.blocker):"")+'</div>'
       +'<div class="en">'+esc(s.reply)+'</div>'+(s.zh?'<div class="zh">'+esc(s.zh)+'</div>':"")+'</div>';
     btn.disabled=false; btn.textContent="↻ 再跑一次";
   })
   .catch(function(e){ box.innerHTML='<div class="ai"><span class="lb">调用失败</span>'+esc(e.message)+'</div>'; btn.disabled=false; btn.textContent="▶ 跑 谈单舱"; });
}
function saveNote(nid){
  var m=marks(); var key=cur.id+":"+nid; if(!m[key]) m[key]={};
  var inp=document.getElementById("note"+nid); if(inp) m[key].note=inp.value;
  saveMarks(m);
}
function judge(nid,v){
  var m=marks(); var key=cur.id+":"+nid;
  if(!m[key]) m[key]={};
  m[key].v=v;
  var inp=document.getElementById("note"+nid); if(inp){ m[key].note=inp.value; }
  if(v==="good"){ toggle("g"+nid,"on-good"); toggle("b"+nid,""); toggle("x"+nid,""); }
  if(v==="bad"){ toggle("b"+nid,"on-bad"); toggle("g"+nid,""); toggle("x"+nid,""); }
  if(v==="fix"){ toggle("x"+nid,"on-fix"); toggle("g"+nid,""); toggle("b"+nid,""); }
  saveMarks(m); updateSum();
}
function toggle(id,cls){ var el=document.getElementById(id); if(!el) return; ["on-good","on-bad","on-fix"].forEach(function(c){el.classList.remove(c);}); if(cls) el.classList.add(cls); }
function updateSum(){
  var m=marks(), g=0,b=0,x=0;
  cur.blocks.forEach(function(bl){ if(bl.k!=="node") return; var mk=m[cur.id+":"+bl.id]; if(!mk||!mk.v) return; if(mk.v==="good")g++; else if(mk.v==="bad")b++; else if(mk.v==="fix")x++; });
  var done=g+b+x, total=cur.blocks.filter(function(b){return b.k==="node";}).length;
  var rate=done? Math.round(g/done*100):0;
  var el=document.getElementById("sum"); el.hidden=false;
  el.innerHTML='<span>已判定 <b>'+done+'/'+total+'</b></span><span class="g">对 <b>'+g+'</b></span><span class="b">差 <b>'+b+'</b></span><span class="f">改 <b>'+x+'</b></span>'+(done?'<span style="margin-left:auto">直接命中率 <b style="color:#4ade80">'+rate+'%</b></span>':"");
}
function doLogin(){
  var u=document.getElementById("lu").value.trim(), p=document.getElementById("lp").value, e=document.getElementById("lerr");
  if(!u||!p){ e.textContent="请输入账号和密码"; return; }
  fetch(proxyUrl()+"/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:u,password:p,mode:"login"})})
   .then(function(r){return r.json();})
   .then(function(j){ if(j&&j.session){ localStorage.setItem(AUTH_KEY,JSON.stringify({session:j.session,name:j.name||u,role:j.role||"admin"})); boot(); } else { e.textContent=(j&&(j.message||j.error))||"登录失败"; } })
   .catch(function(err){ e.textContent="连接失败："+err.message; });
}
function boot(){
  var au=authGet();
  if(au&&au.session){ document.getElementById("login").hidden=true; document.getElementById("app").hidden=false; fillCaseSel(); renderCase(); }
  else { document.getElementById("app").hidden=true; document.getElementById("login").hidden=false; }
}
boot();
</script>
</body>
</html>
